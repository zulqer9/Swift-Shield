# Swift Shield Configuration

# Application Information
app.name=Swift Shield
app.version=2.0.0
app.description=Professional-grade terminal-based password toolkit
app.author=zulqer9
app.copyright=© 2025 Swift Shield

# Password Generation Settings
password.default.length=16
password.min.length=8
password.max.length=128
password.include.uppercase=true
password.include.lowercase=true
password.include.numbers=true
password.include.special=true
password.special.chars=!@#$%^&*()_+-=[]{}|;:,.<>?

# Security Settings
security.secure.random.algorithm=SHA1PRNG
security.password.strength.min.entropy=50
security.clipboard.timeout=30000

# UI Settings
ui.colors.enabled=true
ui.animations.enabled=true
ui.animations.delay=35
ui.welcome.timeout=1000
ui.exit.timeout=3000

# Logging
logging.level=INFO
logging.file.enabled=true
logging.file.path=logs/swift-shield.log
logging.file.max.size=10MB
logging.file.max.files=5

# Performance
performance.password.generation.threads=1
performance.cache.enabled=false